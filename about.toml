# cargo-about: which licenses may appear in the notices we ship.
# Mirrors deny.toml's allow list. deny.toml is the gate; this file is the
# paperwork that gate makes possible.
# Pin the platforms, or the notices depend on who ran the generator: without
# this cargo-about resolves for the host only, so a macOS run and the Linux CI
# run disagree by whichever crates are target gated, and the staleness check is
# red forever through no fault of the tree.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "WTFPL",
    "NCSA",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]
workarounds = ["ring"]
