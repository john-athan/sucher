name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test
        run: cargo test
      - name: Build (release)
        run: cargo build --release
      # Guard the lean build: the `data` feature (DuckDB, ADR 0016) is default-on,
      # so also prove the crate still compiles and its non-DuckDB tests pass with
      # it off — this path has silently broken before.
      - name: Build & test without default features (lean)
        run: |
          cargo build --no-default-features
          cargo test --no-default-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # deny.toml decides which licenses may enter the tree; this job proves the
  # notices we actually ship still match the tree that check passed. A dependency
  # bump that adds a crate silently drops its copyright line otherwise, and the
  # release binary carries that crate's code either way.
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli
      # Some upstream license texts carry CRLF. Left alone, the regenerated file
      # differs from the committed one in line endings only and this job is red
      # forever.
      - name: Regenerate notices
        run: |
          cargo about generate about.hbs -o THIRD_PARTY_LICENSES.md
          perl -pi -e 's/\r\n/\n/g' THIRD_PARTY_LICENSES.md
      - name: Fail if committed notices are stale
        run: |
          if ! git diff --quiet -- THIRD_PARTY_LICENSES.md; then
            echo "THIRD_PARTY_LICENSES.md is out of date. Regenerate it with:"
            echo "  cargo about generate about.hbs -o THIRD_PARTY_LICENSES.md"
            git diff --stat -- THIRD_PARTY_LICENSES.md
            exit 1
          fi
