version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: "sunday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 1
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
    # markup5ever_rcdom has no release matching html5ever 0.40 (crates.io tops
    # out at 0.39.0+unofficial, which requires html5ever ^0.39), so a minor/major
    # bump here breaks the build. Delete this entry once a matching release
    # exists. Patch updates within 0.39 are unaffected and still come through.
    ignore:
      - dependency-name: "html5ever"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: "sunday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
