# Dependency cooldown (Cargo 1.100+): skip crate versions published less than 3 days ago,
# so a compromised release is usually yanked before it reaches a lockfile. Here so CI gets it too.
# One-off override: CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update -p <crate>
[registry]
global-min-publish-age = "3 days"
