[package]
name = "sucher"
version = "0.8.2"
edition = "2021"
authors = ["Jonathan Kaleve <jonathan.kaleve@gmail.com>"]
description = "A fast terminal viewer for files that are awkward in a browser: markdown, spreadsheets, PDF, images, video, docx, pptx, Keynote, email, archives and binary."
license = "MIT"
readme = "README.md"
repository = "https://github.com/john-athan/sucher"
keywords = ["tui", "viewer", "markdown", "pdf", "spreadsheet"]
categories = ["command-line-utilities", "visualization"]
exclude = ["assets/", ".github/", "docs/", "Makefile"]

[features]
# `data` (default-on) is the DuckDB-backed data-file family, Parquet, JSONL,
# SQLite, DuckDB (ADR 0016). It bundles DuckDB (a C++ build; ~46 MB of binary),
# so `cargo install sucher --no-default-features` yields the lean ~29 MB viewer
# without it. `cargo install sucher` gets it.
default = ["data"]
data = ["dep:duckdb", "dep:rusqlite"]
# `embed-pdfium` bakes the fetched libpdfium into the binary (build.rs) instead of
# resolving it beside the executable at runtime. Off by default because macOS
# charges for the whole image at exec, not for the pages that run: 7.2 MB of
# never-executed library costs ~110 ms on EVERY start, including `sucher note.md`.
# Measured on an M-series laptop, a 40 MB blob that no code reads adds 0.63 s.
#
# So packagers install the sidecar (`libpdfium.dylib` beside the binary, or in
# `/opt/homebrew/lib`) and pay nothing, while `cargo install sucher
# --features embed-pdfium` still yields one self-contained file, because
# `cargo install` copies only the binary and cannot place a sidecar. Without
# either, PDF falls back to poppler (ADR 0015). See `src/pdfium.rs`.
embed-pdfium = []

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dependencies]
pulldown-cmark = "0.13"
ratatui = "0.30"
crossterm = "0.29"
calamine = "0.36"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"
zip = "8"
quick-xml = "0.42"
flate2 = "1"
tar = "0.4"
resvg = "0.48"
toml = "1.1"
dirs = "7"
serde = { version = "1", features = ["derive"] }
# Jupyter notebook (.ipynb) parsing, a JSON document of cells.
serde_json = "1"
# Recursive search (ADR 0007): ripgrep's own walker + line searcher.
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
# HTML → markdown (ADR 0008): a real HTML5 parser, not the XML reader.
html5ever = "0.39"
markup5ever_rcdom = "0.39"
# PDF rendering via pdfium (ADR 0015): Chrome's PDF engine, ~100× faster than
# shelling to poppler on scanned pages. The library is loaded at *runtime* (never
# linked), so this dep only pulls in the binding layer. `build.rs` fetches the
# pinned libpdfium for the target and embeds it in the binary (materialised to a
# cache dir on first use), so `cargo install sucher` is self-contained; poppler
# remains the fallback when embedding is skipped.
pdfium-render = "0.9.3"
# Data files (ADR 0016). DuckDB reads Parquet, JSONL and native DuckDB databases;
# its Parquet/JSON readers are statically linked via the `parquet`/`json` features
# (NOT loadable extensions), so they work with zero network. `bundled` compiles
# DuckDB from vendored source, no build-time download, no runtime install.
duckdb = { version = "1", features = ["bundled", "parquet", "json"], optional = true }
# SQLite is read with rusqlite's statically-bundled libsqlite, NOT DuckDB: DuckDB's
# sqlite_scanner is a loadable extension only (no static feature exists) and would
# auto-install over the network on first use, breaking sucher's offline guarantee.
# rusqlite is the SQLite-native engine, fully static and offline (ADR 0016).
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
trash = "5"
mail-parser = { version = "0.11.8", features = ["full_encoding"] }
cfb = "0.14.0"

# build.rs: fetch (curl) + checksum (sha2) + unpack (flate2/tar) the pinned
# libpdfium for the build target. flate2/tar mirror the runtime deps' versions.
[build-dependencies]
sha2 = "0.11"
flate2 = "1"
tar = "0.4"

[[bin]]
name = "sucher"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
